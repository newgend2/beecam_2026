# Mode: solar or fixed
MODE=fixed

# Timezone for local display and solar calculations
TIMEZONE=America/Los_Angeles

# ---------- Solar mode ----------
LATITUDE=40.9437
LONGITUDE=-123.6287

SUNRISE_OFFSET_MIN=60
SUNSET_OFFSET_MIN=-60

# Witty Pi sleep power setting. This is the Witty Pi dummy-load duration value,
# not a direct mA setting. Use 0 to disable.
WITTYPI_DUMMY_LOAD_DURATION=10

# Boot the Pi when Witty Pi 5V input returns after regulator/battery protection.
# Witty Pi register 17: 1 = default on when power connected, 0 = default off.
WITTYPI_POWER_ON_WHEN_POWER_CONNECTED=1

# Voltage-based recovery (registers 19/22), kept as a redundant backstop.
# On this hardware (5V DC regulators that hold a clean ~5V and drop straight
# to ~0V on power loss, not a gradual sag), register 17 above is what
# actually recovers the Pi in practice -- a real power loss looks the same
# as a manual unplug/replug at the register level, a hard disconnect and
# reconnect. LOW/RECOVERY exist in case input voltage ever does linger in an
# intermediate range instead (e.g. a slower battery droop on a different
# power setup). Use 0 to disable either one.
WITTYPI_LOW_VOLTAGE_THRESHOLD=4.0
WITTYPI_RECOVERY_VOLTAGE_THRESHOLD=6.0

# ---------- Fixed mode ----------
FIXED_STARTUP=07:00
FIXED_SHUTDOWN=19:00
FIXED_SCHEDULE_DAYS=3650


# --------- When booting after hours, the camera stays on only long enough to log,
# --------- arm the next startup, and shut down to avoid draining the battery overnight.
AFTER_HOURS_SHUTDOWN_DELAY_MIN=3
