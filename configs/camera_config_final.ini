[camera]
preview_width = 640
preview_height = 480
still_width = 4056
still_height = 3040
buffer_count_preview = 4
buffer_count_still = 1
async_save_queue_size = 2
; Preview/detection framerate. This is the main power lever: the ISP processes the
; full-res main stream at this rate continuously, so lowering it cuts power without
; changing capture resolution or save speed. Trade-off: fewer frames captured during
; each insect visit. Raise back toward 10 if detection coverage suffers.
fps = 5
save_root = /home/pi/data/images_and_labels
capture_cooldown_sec = 0.05

[exposure]
ae_enable = true
; short = fast shutter (less motion blur, less power) but UNDER-exposes in dim light,
; which suppresses detection at dusk/low light. Use 'normal' or 'long' to let AE
; brighten dim scenes (trade-off: more motion blur on flying insects, slightly more power).
ae_exposure_mode = short

; only used if ae_enable = false
exposure_time_us =
analogue_gain =

[display]
; Physical HDMI mode configured in boot_firmware/cmdline.txt.
display_width = 800
display_height = 480

[model]
model_path = /home/pi/beecam/camera/packerout/bombus_model_v1/network.rpk
labels_path = /home/pi/beecam/camera/packerout/bombus_model_v1/labels.txt
threshold = 0.05
iou = 0.15
max_detections = 10
bbox_order = xy
bbox_normalization = true
ignore_dash_labels = true
; Keep false: the IMX500 has no letterbox-pad; preserve_aspect_ratio=true instead
; CENTER-CROPS the sensor to a square (loses ~25% horizontal FOV) AND misplaces boxes
; (convert_inference_coords maps ROI-relative coords onto the full sensor). With false the
; full 4:3 frame is squashed to 640x640 -> full FOV + correct boxes. The detector is
; (re)trained on the SAME 640x640 squash so it handles the distortion at full confidence.
preserve_aspect_ratio = false
postprocess =

[stale_detection]
enabled = true
detection_sec = 7.0
iou_threshold = 0.3
center_threshold = 0.1
expire_sec = 5
area_ratio_min = 0.50
area_ratio_max = 2.00

[timelapse]
enabled = False
interval_sec = 1

[storage]
check_path = /home/pi/data
stop_percent = 97
check_interval_sec = 60

[schedule]
schedule_wpi_path = /home/pi/wittypi/schedule.wpi

[oled]
enabled = true
refresh_sec = 1.0

[debug]
log_stale_detections = false
stale_log_interval_sec = 5.0
fps_log_interval_sec = 0.0
log_capture_queue = false
log_startup = false


[service]
restart_on_exception = true
restart_delay_sec = 2.0
; Restart backoff: delay doubles each consecutive restart up to this cap (seconds),
; so a persistent fault retries slowly instead of tight-looping every restart_delay_sec.
restart_backoff_max_sec = 300.0
; If a run survives at least this long before crashing, the backoff counter resets
; (the crash is treated as transient rather than a restart loop).
restart_healthy_runtime_sec = 120.0


[logging]
exception_log_path = /home/pi/data/logs/beecam_exception_log.csv
