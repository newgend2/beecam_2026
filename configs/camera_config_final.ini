[camera]
preview_width = 640
preview_height = 480
still_width = 4056
still_height = 3040
buffer_count_preview = 4
buffer_count_still = 1
fps = 10
save_root = /data/images_and_labels
capture_cooldown_sec = 0.20

[exposure]
ae_enable = true
ae_exposure_mode = short

; only used if ae_enable = false
exposure_time_us =
analogue_gain =

[model]
model_path = /home/pi/beecam/camera/packerout/model_v1/network.rpk
labels_path = /home/pi/beecam/camera/packerout/model_v1/labels.txt
threshold = 0.25
iou = 0.65
max_detections = 10
bbox_order = xy
bbox_normalization = true
ignore_dash_labels = true
preserve_aspect_ratio = false
postprocess =

[timelapse]
enabled = False
interval_sec = 1

[storage]
check_path = /data
stop_percent = 97
check_interval_sec = 60

[schedule]
schedule_wpi_path = /home/pi/wittypi/schedule.wpi

[oled]
enabled = true
refresh_sec = 1.0

[debug]
preview_backend = drm
debug_preview = false
draw_detections = false
show_saved_overlay = true


[service]
restart_on_exception = true
restart_delay_sec = 2.0


[logging]
exception_log_path = /data/logs/beecam_exception_log.csv
