[weather]
; Leave blank to use the Raspberry Pi hostname.
unit_name =
save_root = /data/weather
sample_interval_sec = 2.0

[sensors]
; Prevent repeated hardware read failures from filling the exception log.
error_log_interval_sec = 60.0

[wind]
; Legacy anemometer calibration from the original weather station code.
voltage_offset = 0.00575
min_voltage = 0.4
max_voltage = 2.0
max_speed_m_s = 32.4

; ADS1115 defaults match the original code: differential reading between P0 and P1.
; If the ADC is strapped to a non-default I2C address, set ads_address to 0x49, 0x4a, or 0x4b.
; If the wind sensor signal is wired single-ended to P0 and GND, set ads_mode = single_ended.
ads_address = 0x48
ads_gain = 1
ads_data_rate =
ads_mode = differential
ads_positive_pin = P0
ads_negative_pin = P1

[storage]
check_path = /data
stop_percent = 97
check_interval_sec = 60

[schedule]
schedule_wpi_path = /home/pi/wittypi/schedule.wpi

[oled]
enabled = true
refresh_sec = 1.0

[service]
restart_on_exception = true
restart_delay_sec = 2.0

[logging]
exception_log_path = /data/logs/weather_station_exception_log.csv
