# Mode: solar or fixed
MODE=solar

# Timezone for local display and solar calculations
TIMEZONE=America/Los_Angeles

# ---------- Solar mode ----------
LATITUDE=40.9437
LONGITUDE=-123.6287

SUNRISE_OFFSET_MIN=0
SUNSET_OFFSET_MIN=0

# ---------- Fixed mode ----------
FIXED_STARTUP=07:00
FIXED_SHUTDOWN=20:00


# --------- When booting after hours, the station will shut down at either sunrise or fixed startup,
# --------- then restart after this delay so the normal operating schedule can take over.
AFTER_HOURS_RESTART_DELAY_MIN=2
